name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check hook executable bits
        run: |
          for hook in .githooks/pre-commit .githooks/pre-push; do
            test -x "$hook" || { echo "$hook is not executable"; exit 1; }
          done
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...

  diff-coverage:
    name: Diff Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gocover-cobertura
        run: go install github.com/boumenot/gocover-cobertura@v1.5.0
      - name: Install diff-cover
        run: pip install diff-cover==10.5.1
      - name: Generate coverage profile
        run: |
          PKGS=$(go list ./... | grep -Ev 'github.com/reithan/teach-me/(cmd/tm|internal/tools)$' | tr '\n' ' ')
          go test -race -covermode=atomic -coverprofile=coverage.out $PKGS
      - name: Convert to Cobertura XML
        run: |
          go tool gocover-cobertura < coverage.out > coverage.xml
          sed -i 's|github.com/reithan/teach-me/||g' coverage.xml
      - name: Check diff coverage
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=85

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go tool govulncheck ./...
