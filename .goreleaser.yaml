version: 2

builds:
  - id: tm
    main: ./cmd/tm
    binary: tm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "tm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - CITATION.cff
      - skill/teach-me/**

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md via --release-notes in release.yml,
# which skips GoReleaser's commit-based changelog.

release:
  prerelease: auto
