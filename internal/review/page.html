<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Card review</title>
<style>
  /* The page may load no fonts (the CSP has no font-src), so both stacks name
     faces already on the learner's machine. Card text is set in a reading
     serif; Sitka Text ships with Windows 10 and later, Iowan and Charter with
     macOS. Everything else uses the system face. */
  :root {
    color-scheme: light dark;
    --desk: #e8ecf1;
    --stock: #ffffff;
    --ink: #1f2633;
    --dim: #5f6b7d;
    --rule: #a9c6ea;
    --red: #d9546a;
    --accent: #2f6fb3;
    --line: #c9d1dc;
    --serif: "Iowan Old Style", "Sitka Text", Charter, "Bitstream Charter", Cambria, Georgia, serif;
    --sans: system-ui, "Segoe UI", sans-serif;
    --pitch: 2rem; /* the gap between blue rules, and the back's line height */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #1a1e25;
      --stock: #252a33;
      --ink: #e4e8ee;
      --dim: #9aa4b3;
      --rule: #34465f;
      --red: #c94f62;
      --accent: #7aaee8;
      --line: #3a414d;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body { font: 1rem/1.5 var(--sans); color: var(--ink); margin: 0 auto; padding: 1.25rem 1rem 3rem; max-width: 42rem; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  nav { display: flex; gap: .25rem; }
  #left { margin-left: auto; color: var(--dim); font-size: .875rem; }
  /* On a phone the page title gives way to the controls; it stays for screen readers. */
  @media (max-width: 34rem) { h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); } }

  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: .375rem; background: var(--stock); padding: .5rem 1rem; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav button { border-color: transparent; background: transparent; padding: .25rem .75rem; font-size: .9375rem; }
  nav button[aria-pressed="true"] { background: var(--stock); border-color: var(--line); }
  kbd { font: inherit; font-size: .8125rem; color: var(--dim); }

  /* The index card: the front sits above the red rule, the back is written
     on the blue rules below it. */
  .card { background: var(--stock); border-radius: 3px; box-shadow: 0 1px 2px #0002, 0 6px 20px -8px #0003; padding: 1.25rem 1.5rem 1rem; }
  .top { display: flex; gap: 1rem; justify-content: space-between; color: var(--dim); font-size: .8125rem; }
  .top span:last-child { flex: none; }
  .front { font: 1.5rem/1.35 var(--serif); margin: .75rem 0 1rem; }
  .ruled { border-top: 2px solid var(--red); min-height: calc(var(--pitch) * 3);
    background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--pitch) - 1px), var(--rule) calc(var(--pitch) - 1px) var(--pitch)); }
  .back { font: 1.25rem/var(--pitch) var(--serif); }
  .front, .back, .list-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #back:not([hidden]) { animation: ink .18s ease-out; }
  @keyframes ink { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #back:not([hidden]) { animation: none; } }

  /* Controls sit under the card, in one place whether they reveal or rate. */
  .controls { margin-top: 1rem; }
  #reveal { width: 100%; padding: .75rem; }
  #reveal kbd { margin-left: .5rem; }
  .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
  .ratings button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: .5rem .75rem .625rem; }
  .ratings .name { display: flex; width: 100%; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .ratings .hint { font-size: .8125rem; color: var(--dim); line-height: 1.3; }
  .ratings [data-rating="1"] .name span { color: var(--red); }
  @media (max-width: 34rem) { .ratings { grid-template-columns: 1fr 1fr; } }

  #error { color: var(--red); min-height: 1.5rem; margin: .75rem 0 0; }
  [hidden] { display: none !important; }

  /* All cards: one sheet, rows divided by blue rules. */
  .sheet { background: var(--stock); border-radius: 3px; box-shadow: 0 1px 2px #0002; padding: 0 1.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--rule); padding: 1rem 0; }
  li:last-child { border-bottom: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem 1.5rem; font: 1.0625rem/1.4 var(--serif); }
  .pair .list-text:last-child { color: var(--dim); }
  @media (max-width: 34rem) { .pair { grid-template-columns: 1fr; } }
  .facts { display: flex; flex-wrap: wrap; gap: .25rem 1rem; color: var(--dim); font-size: .8125rem; margin-top: .5rem; }
  .actions { display: flex; gap: .25rem; margin: .375rem 0 0 -.5rem; }
  .actions button { border-color: transparent; background: transparent; padding: .125rem .5rem; font-size: .875rem; color: var(--accent); }
  .actions button:hover { border-color: var(--line); }
  .actions .save { border-color: var(--accent); }
  .actions.editing { margin-left: 0; }
  .actions .remove { color: var(--dim); }
  .actions .remove:hover { color: var(--red); border-color: var(--red); }
  .empty { color: var(--dim); }
  textarea { font: 1.0625rem/1.4 var(--serif); color: inherit; width: 100%; min-height: 4rem; field-sizing: content; margin: .25rem 0; padding: .5rem; border: 1px solid var(--line); border-radius: .375rem; background: var(--desk); }
</style>
</head>
<body>
<header>
  <h1>Card review</h1>
  <nav>
    <button id="to-review" aria-pressed="true">Review</button>
    <button id="to-cards" aria-pressed="false">All cards</button>
  </nav>
  <span id="left"></span>
</header>

<!-- Two views, one shown at a time. The card list shows every back, so it
     never shares the screen with a card under review. -->
<div id="review-view">
<section id="review" hidden>
  <div class="card">
    <div class="top"><span id="origin"></span><span id="number"></span></div>
    <div id="front" class="front"></div>
    <div class="ruled"><div id="back" class="back" hidden></div></div>
  </div>
  <div class="controls">
    <div id="reveal-row">
      <button id="reveal">Show the back<kbd>Space</kbd></button>
    </div>
    <div id="rate-row" class="ratings" hidden>
      <button data-rating="1"><span class="name"><span>Again</span><kbd>1</kbd></span><span class="hint">Forgot it; it comes back soon</span></button>
      <button data-rating="2"><span class="name"><span>Hard</span><kbd>2</kbd></span><span class="hint">Recalled it, with effort</span></button>
      <button data-rating="3"><span class="name"><span>Good</span><kbd>3</kbd></span><span class="hint">Recalled it</span></button>
      <button data-rating="4"><span class="name"><span>Easy</span><kbd>4</kbd></span><span class="hint">Recalled it at once</span></button>
    </div>
  </div>
</section>
<section id="done" hidden>
  <div class="card">
    <div class="front">Nothing is due right now.</div>
    <div class="ruled"></div>
  </div>
  <div class="controls"><button id="again">Check again</button></div>
</section>
</div>
<div id="cards-view" hidden>
  <div class="sheet"><ul id="list"></ul></div>
</div>
<div id="error" role="alert"></div>

<script>
"use strict";
// Card text reaches the page only through textContent and textarea values,
// never as HTML.
const $ = (id) => document.getElementById(id);
let current = null;   // the card on screen
let shown = false;    // whether its back is showing
let busy = false;     // a request is in flight
let cardsView = false; // the card list is on screen instead of the review

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function call(route, body) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  let res;
  try {
    res = await fetch(route, opt);
  } catch (e) {
    throw new Error("The review server did not answer. It stops after a while with no use; ask for a new link.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("request failed: " + res.status));
  return data;
}

// run does one action, with the buttons off while it is in flight, and
// shows an error in place.
async function run(fn) {
  if (busy) return;
  busy = true;
  $("error").textContent = "";
  try {
    await fn();
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    busy = false;
  }
}

// place turns a citation, <hash>@<locator>:START-END, into the file name and
// lines a learner can look up; the hash means nothing to them.
function place(src) {
  const m = /^[^@]*@(.*):(\d+)-(\d+)$/.exec(src);
  if (!m) return src;
  const file = m[1].split(/[/:\\]/).pop();
  return file + (m[2] === m[3] ? ", line " + m[2] : ", lines " + m[2] + "–" + m[3]);
}

// origin says who wrote the card, and where it came from when it was taken
// from a source, so the learner can tell the two apart (§17.5).
function origin(c) {
  let s;
  if (c.origin === "user") s = "Your card";
  else if (c.origin === "teacher") s = "Your teacher's card";
  else s = c.src ? "From " + place(c.src) : "From a source";
  if (c.concept) s += ", for " + c.concept;
  return s;
}

// originEl is origin as an element, with the full citation on hover.
function originEl(c) {
  const e = el("span", "", origin(c));
  if (c.src) e.title = c.src;
  return e;
}

function show(next) {
  current = next.card;
  shown = false;
  $("left").textContent = next.left === 0 ? "" : next.left === 1 ? "1 card left" : next.left + " cards left";
  $("review").hidden = !current;
  $("done").hidden = !!current;
  if (!current) return;
  $("origin").replaceChildren(originEl(current));
  $("number").textContent = "Card " + current.n;
  $("front").textContent = current.front;
  $("back").textContent = current.back;
  $("back").hidden = true;
  $("reveal-row").hidden = false;
  $("rate-row").hidden = true;
}

function reveal() {
  if (!current || shown) return;
  shown = true;
  $("back").hidden = false;
  $("reveal-row").hidden = true;
  $("rate-row").hidden = false;
}

function rate(rating) {
  if (!current || !shown) return;
  run(async () => {
    show(await call("api/review", { n: current.n, rating }));
  });
}

// view switches between the review and the card list. The list is fetched
// only when it is opened, so no back reaches the page during a review; going
// back to the review fetches the next card, since an edit may have changed it.
function view(cards) {
  run(async () => {
    if (cards) {
      await list();
    } else {
      show(await call("api/next"));
    }
    cardsView = cards;
    $("review-view").hidden = cards;
    $("cards-view").hidden = !cards;
    if (!cards) $("list").replaceChildren();
    $("to-review").setAttribute("aria-pressed", String(!cards));
    $("to-cards").setAttribute("aria-pressed", String(cards));
  });
}

// status says, in words, where the card stands in its schedule.
function status(c) {
  switch (c.state) {
    case "waiting": return "Waits until " + c.concept + " is passed";
    case "held": return "Held";
    case "new": return "New";
  }
  if (!c.due) return "";
  const ms = new Date(c.due) - Date.now();
  if (ms <= 0) return "Due now";
  const days = Math.round(ms / 86400000);
  if (days === 0) return "Due later today";
  return days === 1 ? "Due tomorrow" : "Due in " + days + " days";
}

async function list() {
  const data = await call("api/cards");
  const ul = $("list");
  ul.replaceChildren();
  if (data.cards.length === 0) ul.append(el("li", "empty", "There are no cards yet. Your teacher adds them after you pass a concept."));
  for (const c of data.cards) ul.append(item(c));
}

function item(c) {
  const li = el("li");
  const pair = el("div", "pair");
  pair.append(el("div", "list-text", c.front), el("div", "list-text", c.back));
  const facts = el("div", "facts");
  facts.append(el("span", "", "Card " + c.n), originEl(c));
  const st = status(c);
  if (st) facts.append(el("span", "", st));
  if (c.lapses > 0) facts.append(el("span", "", c.lapses === 1 ? "Forgotten once" : "Forgotten " + c.lapses + " times"));
  const row = el("div", "actions");
  const edit = el("button", "", "Edit");
  edit.onclick = () => editor(li, c);
  // A waiting card can be held too: the hold takes effect once its concept
  // is passed.
  const held = c.state === "held";
  const hold = el("button", "", held ? "Release" : "Hold");
  hold.onclick = () => change("api/hold", { n: c.n, on: !held });
  const rm = el("button", "remove", "Remove");
  rm.onclick = () => {
    if (confirm("Remove card " + c.n + "? This cannot be undone here.")) change("api/remove", { n: c.n });
  };
  row.append(edit, hold, rm);
  li.append(pair, facts, row);
  return li;
}

function editor(li, c) {
  const front = el("textarea");
  front.value = c.front;
  front.setAttribute("aria-label", "Front");
  const back = el("textarea");
  back.value = c.back;
  back.setAttribute("aria-label", "Back");
  const row = el("div", "actions editing");
  const save = el("button", "save", "Save");
  save.onclick = () => change("api/edit", { n: c.n, front: front.value, back: back.value });
  const cancel = el("button", "", "Cancel");
  cancel.onclick = () => li.replaceWith(item(c));
  row.append(save, cancel);
  const facts = el("div", "facts");
  facts.append(el("span", "", "Card " + c.n), originEl(c));
  li.replaceChildren(facts, front, back, row);
  front.focus();
}

// change makes one change to a card, then redraws the card on screen and,
// in the card list, the list, since the change may have reworded or removed
// the card being shown.
function change(route, body) {
  run(async () => {
    await call(route, body);
    show(await call("api/next"));
    if (cardsView) await list();
  });
}

$("to-review").onclick = () => view(false);
$("to-cards").onclick = () => view(true);
$("reveal").onclick = reveal;
for (const b of document.querySelectorAll("[data-rating]")) {
  b.onclick = () => rate(Number(b.dataset.rating));
}
$("again").onclick = () => change("api/start", {});

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if (e.ctrlKey || e.metaKey || e.altKey || cardsView) return;
  if (!shown && (e.key === " " || e.key === "Enter")) {
    // On a focused button the browser clicks it itself.
    if (t && t.tagName === "BUTTON") return;
    e.preventDefault();
    reveal();
  } else if (shown && e.key >= "1" && e.key <= "4") {
    rate(Number(e.key));
  }
});

// Every page load starts a sitting, which draws a new random order.
run(async () => {
  show(await call("api/start", {}));
});
</script>
</body>
</html>
